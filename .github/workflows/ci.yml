name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test-fraud-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/fraud-api/requirements.txt pytest httpx
      - name: pytest fraud-api
        working-directory: services/fraud-api
        run: pytest -q

  test-guardian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r services/guardian/requirements.txt pytest
      - name: pytest guardian
        working-directory: services/guardian
        run: pytest -q

  # Boots the three services as processes and runs the endpoint audit plus the
  # end-to-end silent-failure scenario (corrupt -> incident -> approve -> resolved).
  integration:
    runs-on: ubuntu-latest
    needs: [test-fraud-api, test-guardian]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: >
          pip install
          -r services/fraud-api/requirements.txt
          -r services/guardian/requirements.txt
          -r services/chaos-injector/requirements.txt
      - name: audit + end-to-end scenario
        run: bash scripts/ci_smoke.sh

  build:
    runs-on: ubuntu-latest
    needs: [test-fraud-api, test-guardian]
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config -q
      - name: Build fraud-api image
        run: docker build -t guardianops-fraud-api services/fraud-api
      - name: Build guardian image
        run: docker build -t guardianops-guardian services/guardian
      - name: Build chaos-injector image
        run: docker build -t guardianops-chaos services/chaos-injector
